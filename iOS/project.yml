name: Doctor
options:
  bundleIdPrefix: com.matty8r
  # This project generates ./Doctor.xcodeproj on demand from this file —
  # regenerate with `xcodegen generate` (from this directory) after editing.
  # Doctor.xcodeproj itself is gitignored: the source of truth is this file.
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

# The shared engine lives one level up, in the root SwiftPM package
# (Package.swift), as the DoctorMarkdown and DoctorEditorKit library
# products. This project depends on it as a local Swift package rather
# than duplicating any of that source under iOS/ — see ../docs/ios.md.
packages:
  Doctor:
    path: ..

targets:
  Doctor:
    type: application
    platform: iOS
    sources:
      - path: Doctor
    dependencies:
      - package: Doctor
        product: DoctorMarkdown
      - package: Doctor
        product: DoctorEditorKit
      - package: Doctor
        product: DoctorLibrary
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.matty8r.Doctor
        DEVELOPMENT_TEAM: CG3Q63736Q
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Doctor
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "8"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
    entitlements:
      path: Doctor/Doctor.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.matty8r.Doctor
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.ubiquity-container-identifiers: []
        aps-environment: development
    info:
      path: Doctor/Info.plist
      properties:
        UILaunchScreen: {}
        # Only standard Apple networking (CloudKit) — exempt from export
        # compliance, so TestFlight builds don't sit waiting on App Store
        # Connect's encryption question before testers can install them.
        ITSAppUsesNonExemptEncryption: false
        # Explicit build-setting placeholders, not xcodegen's own literal
        # "1.0"/"1" defaults for these two keys — without this, xcodegen
        # bakes in its defaults on every `generate`, clobbering any value
        # actually set in MARKETING_VERSION/CURRENT_PROJECT_VERSION above
        # and silently re-uploading the same build number App Store Connect
        # already has (confirmed: it does this unconditionally, not just
        # once on first write — caught when a version bump for this exact
        # fix got clobbered back to "1" and the TestFlight upload was
        # rejected for repeating a build number already used).
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # Document-type association, mirroring the Mac app's Info.plist
        # (Resources/Info.plist) so Doctor appears in Files' "Open With"
        # menu for Markdown/text files. Doctor imports rather than edits
        # in place -- opening a file copies its contents into a new
        # library document rather than keeping a live link to the
        # original -- so LSSupportsOpeningDocumentsInPlace is explicitly
        # false, not just left to default.
        LSSupportsOpeningDocumentsInPlace: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: Markdown Document
            LSItemContentTypes:
              - net.daringfireball.markdown
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
          - CFBundleTypeName: Plain Text Document
            LSItemContentTypes:
              - public.plain-text
              - public.text
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: net.daringfireball.markdown
            UTTypeConformsTo:
              - public.plain-text
            UTTypeDescription: Markdown Document
            UTTypeTagSpecification:
              public.filename-extension:
                - md
                - markdown
                - mdown
                - mkd
                - mkdn
                - mdtext
                - mdtxt
                - text
              public.mime-type:
                - text/markdown
                - text/x-markdown
schemes:
  Doctor:
    build:
      targets:
        Doctor: all
    run:
      config: Debug
    test:
      config: Debug
